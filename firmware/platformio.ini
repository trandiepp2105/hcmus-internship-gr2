; PlatformIO Project Configuration File
; PH_CONTROLLER - Complete pH Monitor with ATC System
; Author: PH_CONTROLLER Team

[platformio]
default_envs = esp32dev
description = Hệ thống giám sát pH tích hợp bù nhiệt tự động (ATC) và giao tiếp MQTT

; ============================================================
; Cấu hình chung cho tất cả các môi trường
; ============================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = 
    colorize
    time
    esp32_exception_decoder
    send_on_enter

; Build flags chung
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM=0   ; Tắt PSRAM để tránh lỗi khởi tạo trên DevKit phổ biến
    -I src/sensors         ; Đường dẫn include cho cảm biến
    -I src/storage         ; Đường dẫn include cho bộ đệm RAM

; Thư viện cần thiết cho dự án
lib_deps = 
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    bblanchon/ArduinoJson @ ^6.19.4
    knolleary/PubSubClient @ ^2.8

; ============================================================
; Môi trường phát triển chính (Main Development)
; ============================================================
[env:esp32dev]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; Cấu hình nạp
upload_speed = 460800
upload_port = COM17 

; Quét tất cả các thư mục chức năng để biên dịch
build_src_filter = +<*> +<sensors/> +<storage/>

; ============================================================
; Môi trường Test dành riêng cho RAM Storage
; ============================================================
[env:test_ram_storage]
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D TEST_RAM_STORAGE
build_src_filter = +<storage/> +<main.cpp>

; ============================================================
; Môi trường Production (Tối ưu hóa bộ nhớ và tốc độ)
; ============================================================
[env:production]
board = esp32dev
build_type = releases
build_flags = 
    ${env.build_flags}
    -O2            ; Tối ưu hóa tốc độ thực thi
    -D NDEBUG      ; Tắt các lệnh debug để tiết kiệm tài nguyên