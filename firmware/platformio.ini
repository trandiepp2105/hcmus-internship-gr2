; PlatformIO Project Configuration File
; PH_CONTROLLER - Complete pH Monitor with ATC System
; Author: PH_CONTROLLER Team

[platformio]
default_envs = esp32dev
description = Hệ thống giám sát pH tích hợp bù nhiệt tự động (ATC) và giao tiếp MQTT

; ============================================================
; Cấu hình chung cho tất cả các môi trường
; ============================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = 
    colorize
    time
    esp32_exception_decoder
    send_on_enter

; Build flags chung
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM=0   ; Tắt PSRAM để tránh lỗi khởi tạo trên DevKit phổ biến
    -I src/sensors ;

; Thư viện cần thiết cho dự án
lib_deps = 
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    bblanchon/ArduinoJson @ ^6.19.4
    knolleary/PubSubClient @ ^2.8

; ============================================================
; Môi trường phát triển chính (Main Development)
; ============================================================
[env:esp32dev]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; Cấu hình nạp (Thay đổi upload_port theo máy của bạn)
upload_speed = 460800
upload_port = COM17 

; Tự động tìm nạp các file trong src/ và các thư mục con
build_src_filter = +<*> +<sensors/>

; ============================================================
; Môi trường Test dành riêng cho DS18B20
; ============================================================
[env:test_temperature]
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D TEST_TEMPERATURE_SENSOR
build_src_filter = +<sensors/temperature_sensor.*> +<main.cpp>

; ============================================================
; Môi trường Test dành riêng cho Calibration/EEPROM
; ============================================================
[env:test_calibration]
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D TEST_CALIBRATION_EEPROM
build_src_filter = +<sensors/ph_calibration.*> +<main.cpp>

; ============================================================
; Môi trường Production (Tối ưu hóa bộ nhớ và tốc độ)
; ============================================================
[env:production]
board = esp32dev
build_type = release
build_flags = 
    ${env.build_flags}
    -O2            ; Tối ưu hóa tốc độ thực thi
    -D NDEBUG      ; Tắt các lệnh debug để tiết kiệm tài nguyên