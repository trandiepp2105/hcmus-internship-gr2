; PlatformIO Project Configuration File
; PH_CONTROLLER Firmware Configuration

[platformio]
default_envs = esp32dev

; Common settings for all environments
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = 
    colorize
    time
    esp32_exception_decoder
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
lib_deps = 
    ; Add any external libraries here

; Main development environment - ESP32 DevKit
[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
upload_speed = 921600

; Environment for sensor readings testing
[env:sensor_readings]
platform = espressif32
board = esp32dev
build_src_filter = 
    +<*>
    +<sensors/>
build_flags = 
    ${env.build_flags}
    -DTEST_SENSOR_READINGS

; Environment for calibration EEPROM testing
[env:calibration_eeprom]
platform = espressif32
board = esp32dev
build_src_filter = 
    +<*>
    +<sensors/>
build_flags = 
    ${env.build_flags}
    -DTEST_CALIBRATION_EEPROM

; Production environment with optimizations
[env:production]
platform = espressif32
board = esp32dev
build_flags = 
    ${env.build_flags}
    -O2
    -DNDEBUG
build_type = release